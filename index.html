<html lang="fr">

<link rel="manifest" href="manifest.webmanifest">

<title>PicTalk</title>
<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#1f2328;--mut:#5c6570;--bd:#c9c5b8;--bgl:90%;--bgs:75%;--bdl:45%;--tl:18%}
@media(prefers-color-scheme:dark){:root{--bg:#17191c;--sf:#222529;--tx:#eceef0;--mut:#9aa3ad;--bd:#555c64;--bgl:24%;--bgs:35%;--bdl:62%;--tl:92%;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overscroll-behavior:none;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;touch-action:manipulation}
.app{height:100dvh;display:flex;flex-direction:column;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.bar{background:var(--sf);border:2px solid var(--bd);border-radius:14px;padding:6px;display:flex;gap:8px;align-items:center}
.msg{flex:1;min-height:54px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:clamp(18px,3.2vmin,28px);overflow:hidden;max-height:25vh}
.chip{background:hsl(var(--h) var(--bgs) var(--bgl));border:2px solid hsl(var(--h) 45% var(--bdl));color:hsl(var(--h) 50% var(--tl));border-radius:8px;padding:2px 10px;font-weight:700}
.ctl{border:2px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:12px;font-size:1.2rem;cursor:pointer;min-height:48px;min-width:52px;padding:6px 12px}
.ctl.go{background:#2f7d4f;color:#fff;border-color:#2f7d4f;font-size:1.7rem;min-width:96px;min-height:62px;font-weight:700}
.nav{display:flex;align-items:center;gap:8px}
.crumb{flex:1;font-weight:700;font-size:1.15rem}
.editbar{display:none;gap:8px}
body.edit .editbar{display:flex}
body.edit .grid{outline:4px dashed #e0a100;outline-offset:3px}
#gear{opacity:.55}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:8px}
.cell{border:2px dashed color-mix(in srgb,var(--bd) 45%,transparent);border-radius:12px;background:none;color:var(--mut);font-size:2rem}
body:not(.edit) .cell{pointer-events:none}
.w{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 6px;overflow:hidden;cursor:pointer;font-weight:700;font-size:clamp(13px,2.7vmin,26px);line-height:1.12;border-radius:12px;border:2px solid hsl(var(--h) 45% var(--bdl));background:hsl(var(--h) var(--bgs) var(--bgl));color:hsl(var(--h) 50% var(--tl));position:relative;text-align:center;min-width:0}
.w .ic{font-size:1.9em;line-height:1}
.w img{max-height:52%;max-width:80%;object-fit:contain;pointer-events:none;border-radius:6px}
.w .lb{overflow-wrap:anywhere}
.w.br::after{content:"›";position:absolute;right:7px;top:2px;font-size:1.2em;opacity:.7}
.w.sil{border-style:dashed;border-width:3px;background:var(--sf);color:var(--tx);border-color:var(--bd)}
.w.sil::before{content:"";position:absolute;left:8px;top:0;width:30px;height:7px;border-radius:0 0 6px 6px;background:var(--bd)}
.w:active{transform:scale(.97)}
.pq{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;height:clamp(56px,11vh,84px);padding-top:8px;border-top:3px solid var(--bd)}
.pq .w,.pq .cell{flex-direction:row;gap:8px}
.c-p{--h:48}.c-v{--h:130}.c-n{--h:28}.c-a{--h:210}.c-q{--h:275}.c-s{--h:345}.c-f{--h:215}
:focus-visible{outline:4px solid #1a73e8;outline-offset:2px}
dialog{width:min(580px,94vw);max-height:92vh;overflow:auto;border:2px solid var(--bd);border-radius:16px;background:var(--sf);color:var(--tx);padding:14px;user-select:text;-webkit-user-select:text}
dialog::backdrop{background:rgba(0,0,0,.5)}
.f{display:flex;flex-direction:column;gap:10px}.f h3{margin:0}
.f label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--mut)}
.f label.ck{flex-direction:row;align-items:center;gap:8px;color:var(--tx);font-size:1rem}
.f input:not([type=checkbox]):not([type=range]),.f select{font:inherit;font-size:1.05rem;padding:9px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.f input[type=checkbox]{width:24px;height:24px}
.f button,.f .btn{font:inherit;padding:10px 14px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);cursor:pointer;flex-direction:row;align-items:center}
.f .ok{background:#2f7d4f;color:#fff;border-color:#2f7d4f;font-weight:700}
.im{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.im input{width:110px}
.prev{width:60px;height:60px;border:2px dashed var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;overflow:hidden}.prev img{max-width:100%;max-height:100%}
.pal{display:flex;flex-wrap:wrap;gap:4px}.pal button{font-size:1.5rem;padding:4px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:14%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:12px;z-index:99;max-width:90vw}
</style>
</head>

 if(!t.m)msg.push({w,c:t.k||"n"});
 if(t.to&&db.pages[t.to]){nav.push(cur);cur=t.to;draw()}else if(!t.m)fin();else draw()}

/* édition d'une entrée */
const COL=[["p","Sujet (jaune)"],["v","Verbe (vert)"],["n","Nom (orange)"],["a","Adjectif (bleu)"],["q","Question (violet)"],["s","Social / négation (rose)"],["f","Neutre (gris)"]];
const EMO="🍽️ 🥤 🍝 🍎 🍰 🥐 🏠 🏫 🌳 🎮 🃏 ⚽ 🚗 🐶 🐱 👪 🧒 😀 😢 😡 😴 🤒 ❤️ 👍 👎 ✋ 📖 🎨 🎵 📱 🧸 🛁".split(" ");
function pageOptions(sel){const o=Object.entries(db.pages).sort((a,b)=>a[1].t.localeCompare(b[1].t,"fr"));const cnt={};o.forEach(([,p])=>cnt[p.t]=(cnt[p.t]||0)+1);
 sel.appendChild(new Option("— aucune (mot simple) —",""));sel.appendChild(new Option("➕ Nouvelle page",".new"));
 o.forEach(([id,p])=>sel.appendChild(new Option(cnt[p.t]>1?p.t+" ("+id+")":p.t,id)))}
function editTile(arr,i){
 const old=arr[i],t=old?clone(old):{l:"",k:"n",m:false,to:null};let im=t.i||null;
 const d=$("dlg");
 d.innerHTML='<div class="f"><h3></h3><label>Libellé<input id="fl"></label><label>Texte énoncé (si différent)<input id="fs"></label><label class="ck"><input type="checkbox" id="fv"> Énoncer ce mot</label><label>Page liée<select id="fp"></select></label><label>Couleur<select id="fk"></select></label><div class="im"><span id="fim" class="prev"></span><input id="fe" maxlength="8" placeholder="Emoji"><label class="btn">📷 Photo / image<input type="file" id="ff" accept="image/*" hidden></label><button type="button" id="frm">Retirer</button></div><div class="pal" id="pal"></div><div class="row"><button type="button" class="ok" id="fok">Enregistrer</button><button type="button" id="fmv">Déplacer</button><button type="button" id="fdel">Supprimer</button><button type="button" id="fop">Ouvrir la page</button><button type="button" id="fno">Annuler</button></div></div>';
 d.querySelector("h3").textContent=old?"Modifier l’entrée":"Nouvelle entrée";
 $("fl").value=t.l;$("fs").value=t.s||"";$("fv").checked=!t.m;$("fe").value=im&&im.e||"";
 pageOptions($("fp"));$("fp").value=t.to||"";
 COL.forEach(([v,n])=>$("fk").appendChild(new Option(n,v)));$("fk").value=t.k||"n";
 const prev=()=>{const p=$("fim");p.innerHTML="";if(im&&im.e)p.textContent=im.e;else if(im&&im.b&&imgs.has(im.b)){const x=E("img");x.src=imgs.get(im.b);p.appendChild(x)}};prev();
 EMO.forEach(e=>{const b=E("button",null,e);b.type="button";b.onclick=()=>{im={e};$("fe").value=e;prev()};$("pal").appendChild(b)});
 $("fe").oninput=()=>{const v=$("fe").value.trim();im=v?{e:v}:null;prev()};
 $("ff").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{im={b:await addImage(f)};$("fe").value="";prev()}catch(x){toast("Image illisible")}};
 $("frm").onclick=()=>{im=null;$("fe").value="";prev()};
 $("fmv").hidden=$("fdel").hidden=!old;$("fop").hidden=!(old&&old.to);
 $("fno").onclick=()=>d.close();
 $("fdel").onclick=()=>{arr[i]=null;save();d.close();draw()};
 $("fmv").onclick=()=>{moving={arr,i};d.close();toast("Touchez la nouvelle case")};
 $("fop").onclick=()=>{d.close();nav.push(cur);cur=old.to;draw()};
 $("fok").onclick=()=>{const l=$("fl").value.trim();if(!l){$("fl").focus();return}
  const n={l,k:$("fk").value,m:!$("fv").checked};const s=$("fs").value.trim();if(s)n.s=s;
  let to=$("fp").value;if(to===".new"){to="p"+Date.now().toString(36);db.pages[to]={t:l,c:Array(24).fill(null)}}
  if(!to&&n.m){toast("Un mot simple doit être énoncé");return}
  if(to)n.to=to;else n.to=null;
  if(n.m&&to&&n.k===(t.k||"n")&&n.k!=="f")n.k="f";
  if(im)n.i=im;arr[i]=n;save();d.close();draw()};
 d.showModal()}

/* réglages */
function settings(){const d=$("dlg");
 d.innerHTML='<div class="f"><h3>Réglages</h3><label class="ck"><input type="checkbox" id="sa"> Retour à l’accueil après une phrase</label><label class="ck"><input type="checkbox" id="ss"> Parler automatiquement en fin de phrase</label><label>Genre des accords<select id="sg"><option value="m">Garçon</option><option value="f">Fille</option></select></label><label>Vitesse de la voix<input type="range" id="sr" min="0.5" max="1.3" step="0.05"></label><div class="row"><button type="button" id="sp">Code d’accès…</button><button type="button" id="sx">Exporter la sauvegarde</button><label class="btn">Importer<input type="file" id="si" accept=".json,application/json" hidden></label><button type="button" id="sz">Réinitialiser</button></div><div class="row"><button type="button" class="ok" id="se">Quitter le mode édition</button><button type="button" id="sc">Fermer</button></div></div>';
 $("sa").checked=db.set.auto;$("ss").checked=db.set.spk;$("sg").value=db.set.gen;$("sr").value=db.set.rate;
 const up=()=>{db.set.auto=$("sa").checked;db.set.spk=$("ss").checked;db.set.gen=$("sg").value;db.set.rate=+$("sr").value;save();draw()};
 ["sa","ss","sg","sr"].forEach(k=>$(k).onchange=up);
 $("sc").onclick=()=>d.close();$("se").onclick=()=>{edit=false;d.close();draw()};
 $("sx").onclick=exportAll;$("sp").onclick=()=>setPin();
 $("si").onchange=e=>importAll(e.target.files[0]);
 $("sz").onclick=()=>{if(confirm("Remettre la grille d’origine ? Vos modifications seront perdues.")){db=clone(SEED);save();home();d.close();draw()}};
 d.showModal()}
async function exportAll(){try{const images={};for(const[id,url]of imgs){const b=await(await fetch(url)).blob();images[id]=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}
 const a=E("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({v:1,db,images})],{type:"application/json"}));a.download="pictalk-sauvegarde-"+new Date().toISOString().slice(0,10)+".json";a.click()}catch(e){toast("Export impossible")}}
async function importAll(f){if(!f)return;try{const o=JSON.parse(await f.text());if(!o.db||!o.db.pages||!o.db.pages.home)throw 0;
 await st("img","readwrite",s=>s.clear());imgs=new Map();
 for(const[id,u]of Object.entries(o.images||{})){const b=await(await fetch(u)).blob();await st("img","readwrite",s=>s.put(b,id));imgs.set(id,URL.createObjectURL(b))}
 db=o.db;db.set=Object.assign({auto:true,spk:false,gen:"m",rate:.9},db.set);save();home();$("dlg").close();draw();toast("Sauvegarde importée")}catch(e){toast("Fichier invalide")}}

/* code d'accès au mode édition */
async function H(txt,salt){const d=salt+":"+txt;try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(d));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of d)h=((h<<5)+h+c.charCodeAt(0))>>>0;return"w"+h}}
const rnd=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(x=>x.toString(16).padStart(2,"0")).join("");
const recCode=()=>{const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";return[...crypto.getRandomValues(new Uint8Array(8))].map(x=>A[x%A.length]).join("")};
function askPin(){return new Promise(res=>{
 const d=$("dlg");let done=false;const fin=v=>{if(done)return;done=true;d.onclose=null;if(d.open)d.close();res(v)};
 d.innerHTML='<div class="f"><h3>Code requis</h3><label>Code<input id="pc" type="password" inputmode="numeric" autocomplete="off"></label><div id="pe" style="color:#d4553f;min-height:1.2em"></div><div class="row"><button type="button" class="ok" id="pok">Valider</button><button type="button" id="pfo">Code oublié ?</button><button type="button" id="pno">Annuler</button></div></div>';
 d.onclose=()=>fin(false);$("pno").onclick=()=>fin(false);
 const go=async()=>{if(Date.now()<lock){$("pe").textContent="Patientez "+Math.ceil((lock-Date.now())/1000)+" s";return}
  if(await H($("pc").value,pin.s)===pin.h){bad=0;fin(true)}else{if(++bad>=5){lock=Date.now()+30000;bad=0}$("pe").textContent="Code incorrect";$("pc").value="";$("pc").focus()}};
 $("pok").onclick=go;$("pc").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go()}};
 $("pfo").onclick=async()=>{const r=prompt("Saisissez votre code de secours");if(!r)return;
  if(await H(r.toUpperCase().replace(/[^A-Z0-9]/g,""),pin.s+"r")===pin.r){done=true;d.onclose=null;d.close();res(true);setTimeout(()=>setPin(),60)}else $("pe").textContent="Code de secours incorrect"};
 d.showModal();$("pc").focus()})}
function setPin(){return new Promise(res=>{
 const d=$("dlg");let done=false;const fin=()=>{if(done)return;done=true;d.onclose=null;if(d.open)d.close();res()};d.onclose=fin;
 d.innerHTML='<div class="f"><h3></h3><label>Nouveau code (4 caractères ou plus)<input id="n1" type="password" inputmode="numeric" autocomplete="off"></label><label>Confirmer le code<input id="n2" type="password" inputmode="numeric" autocomplete="off"></label><div id="ne" style="color:#d4553f;min-height:1.2em"></div><div class="row"><button type="button" class="ok" id="nok">Enregistrer</button><button type="button" id="nrm">Retirer le code</button><button type="button" id="nno"></button></div></div>';
 d.querySelector("h3").textContent=pin?"Changer le code d’accès":"Protéger le mode édition";
 $("nrm").hidden=!pin;$("nno").textContent=pin?"Annuler":"Plus tard";$("nno").onclick=fin;
 $("nrm").onclick=async()=>{if(confirm("Retirer la protection par code ?")){pin=null;await st("kv","readwrite",s=>s.delete("pin")).catch(()=>{});toast("Code retiré");fin()}};
 $("nok").onclick=async()=>{const a=$("n1").value;if(a.length<4){$("ne").textContent="Au moins 4 caractères";return}if(a!==$("n2").value){$("ne").textContent="Les deux codes sont différents";return}
  const sl=rnd(8),rc=recCode();pin={s:sl,h:await H(a,sl),r:await H(rc,sl+"r")};
  try{await st("kv","readwrite",x=>x.put(pin,"pin"))}catch(e){toast("Code non enregistré")}
  d.innerHTML='<div class="f"><h3>Code de secours</h3><p>Notez ce code et gardez-le à part : il permet de choisir un nouveau code si vous oubliez celui-ci. Il ne sera plus affiché.</p><p style="font-size:2rem;font-weight:700;letter-spacing:.1em;text-align:center">'+rc.slice(0,4)+"-"+rc.slice(4)+'</p><div class="row"><button type="button" class="ok" id="nfin">J’ai noté le code</button></div></div>';
  $("nfin").onclick=fin};
 d.showModal();$("n1").focus()})}
async function toggleEdit(){
 if(edit){edit=false;moving=null;clearTimeout(idle);draw();toast("Mode enfant");return}
 if(pin){if(!await askPin())return}else if(!pinAsked){pinAsked=true;await setPin()}
 edit=true;bump();draw();toast("Mode édition")}
function bump(){clearTimeout(idle);if(edit)idle=setTimeout(()=>{edit=false;moving=null;if($("dlg").open)$("dlg").close();draw();toast("Mode enfant")},180000)}
document.addEventListener("pointerdown",bump,true);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&edit){edit=false;moving=null;clearTimeout(idle);draw()}});

/* commandes */
$("say").onclick=()=>{say();if(db.set.auto){home();draw()}};
$("del").onclick=()=>{msg.pop();draw()};
let armed=0;$("clr").onclick=()=>{const b=$("clr");if(!armed){armed=1;b.textContent="✕ ?";setTimeout(()=>{armed=0;b.textContent="✕"},2000)}else{armed=0;b.textContent="✕";msg=[];home();draw()}};
$("home").onclick=()=>{home();draw()};
$("up").onclick=()=>{cur=nav.pop()||"home";draw()};
$("ren").onclick=()=>{const n=prompt("Nom de la page",db.pages[cur].t);if(n&&n.trim()){db.pages[cur].t=n.trim();save();draw()}};
$("rmp").onclick=()=>{if(cur==="home"){toast("La page d’accueil ne peut pas être supprimée");return}
 if(!confirm("Supprimer la page « "+db.pages[cur].t+" » ? Les entrées qui y mènent n’auront plus de lien."))return;
 const id=cur;delete db.pages[id];const un=a=>a.forEach(t=>{if(t&&t.to===id)t.to=null});Object.values(db.pages).forEach(p=>un(p.c));un(db.pq);
 cur=nav.pop()||"home";while(!db.pages[cur])cur=nav.pop()||"home";save();draw()};
let lp;$("gear").onpointerdown=()=>{lp=setTimeout(()=>{lp=null;toggleEdit()},900)};
$("gear").onpointercancel=()=>{clearTimeout(lp);lp=null};
$("gear").onpointerup=()=>{if(lp){clearTimeout(lp);lp=null;if(edit)settings()}};
document.addEventListener("contextmenu",e=>e.preventDefault());

(async()=>{
 try{db=await st("kv","readonly",s=>s.get("db"));pin=await st("kv","readonly",s=>s.get("pin"))||null;const k=await st("img","readonly",s=>s.getAllKeys()),v=await st("img","readonly",s=>s.getAll());k.forEach((id,j)=>imgs.set(id,URL.createObjectURL(v[j])));if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 if(!db||!db.pages||!db.pages.home){db=clone(SEED);save()}
 db.set=Object.assign({auto:true,spk:false,gen:"m",rate:.9},db.set);
 draw()})();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
